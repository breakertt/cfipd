name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go code
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Select version
        id: version
        shell: bash
        run: |
          version="0.0.0+git.${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build static binaries and Debian packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/release.sh "$VERSION" dist
      - name: Verify package installation and systemd lifecycle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/test-package.sh "dist/cfipd_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfipd-release
          path: |
            dist/cfipd_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cfipd-release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "cfipd $GITHUB_REF_NAME" --generate-notes
