<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>cfipd</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html { touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; } /* no pinch or double-tap zoom */
  :root { color-scheme:light dark;
    --bg:#eef1ef; --panel:#fbfcfb; --ink:#131a17; --muted:#5d6b64; --line:#dbe2dd; --soft:#f1f4f2;
    --ok:#15803d; --warn:#b45309; --bad:#dc2626; --accent:#0d7d72;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans',Helvetica,Arial,sans-serif; }
  @media (prefers-color-scheme:dark) { :root {
    --bg:#0b120f; --panel:#101815; --ink:#dfe8e3; --muted:#8ba097; --line:#22302a; --soft:#141e1a;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#4fd0c2; } }
  body { font:14px/1.45 var(--sans); background:var(--bg); color:var(--ink); padding:1.2rem 1rem 3rem; }
  main { max-width:1100px; margin:0 auto; }
  .mono { font-family:var(--mono); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; background:currentColor; flex:none; }

  /* one row everywhere; phones drop the update time, which the badge shows on hover */
  header { display:flex; align-items:center; gap:.9rem; }
  h1 { font:600 1.2rem var(--mono); letter-spacing:.02em; flex:none; }
  .status { flex:1; min-width:0; display:flex; align-items:center; gap:.7rem; white-space:nowrap; overflow:hidden; }
  #updated { font-size:.75rem; color:var(--muted); }
  #updated:not(:empty)::before { content:'·'; margin-right:.7rem; }
  @media (max-width:640px) { #updated { display:none; } header { gap:.6rem; } }
  #badge { display:inline-flex; align-items:center; gap:.45em; font-size:.85rem; color:var(--muted); }
  #badge.ok { color:var(--ok); } #badge.warn { color:var(--warn); } #badge.bad { color:var(--bad); }
  nav { display:flex; align-items:center; gap:.4rem; flex:none; }
  #refresh { font-size:.95rem; line-height:1; padding:.25em .6em; }
  nav button { font:.76rem var(--mono); color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:99px; padding:.3em .95em; cursor:pointer; }
  nav button:hover { color:var(--ink); border-color:var(--muted); }
  nav button:disabled { opacity:.5; cursor:default; }
  #tip { position:fixed; pointer-events:none; display:none; z-index:9; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:.25rem .45rem; font:.72rem var(--mono); white-space:pre; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  [data-tip] { cursor:help; }
  #err { display:none; margin-top:.8rem; border:1px solid var(--bad); color:var(--bad); border-radius:8px;
    padding:.5rem .8rem; font:.76rem var(--mono); overflow-wrap:anywhere; }

  h2 { display:flex; align-items:baseline; gap:.6rem; margin:1.6rem 0 .6rem;
    font:600 .7rem var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .empty { color:var(--muted); padding:1rem; border:1px dashed var(--line); border-radius:12px; font-size:.85rem; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:.7rem; }
  .ip { padding:.85rem 1rem .75rem; }
  .ch { display:flex; align-items:center; gap:.55rem; }
  .addr { font:600 .88rem var(--mono); overflow-wrap:break-word; min-width:0; }
  .tags { display:flex; gap:.3rem; margin-left:auto; flex:none; }
  .tag { font:.66rem var(--mono); color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:.05em .4em; }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  .big { display:flex; justify-content:space-between; gap:.8rem; margin:.75rem 0 .7rem; }
  .big .v { font-size:1.1rem; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .big .v small { font-size:.68rem; font-weight:500; color:var(--muted); margin-left:.2em; }
  .big .k { font-size:.7rem; color:var(--muted); margin-top:.2rem; white-space:nowrap; }
  @media (max-width:640px) { .big .v { font-size:1rem; } }
  .meta { display:grid; grid-template-columns:auto 1fr auto 1fr; align-items:baseline; gap:.3rem .7rem; padding-top:.65rem; border-top:1px solid var(--line);
    font:.74rem var(--mono); }
  .meta .k { color:var(--muted); white-space:nowrap; }
  .meta .v { white-space:nowrap; }

  .sel { display:grid; grid-template-columns:auto 1fr; gap:.55rem 1rem; padding:.8rem 1rem; align-items:baseline; }
  .sel .k { font:600 .62rem var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .sel .v { min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:.3rem .7rem; }
  .pill { font:.72rem var(--mono); color:var(--muted); border:1px solid currentColor; border-radius:99px; padding:0 .65em; white-space:nowrap; }
  .pill.ok { color:var(--ok); } .pill.warn { color:var(--warn); }
  .last { font:.74rem var(--mono); color:var(--muted); overflow-wrap:anywhere; }

  .tw { overflow-x:auto; }
  tr.tog { cursor:pointer; }
  tr.tog:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .chev { display:inline-block; width:1rem; font-size:.7rem; color:var(--muted); }
  /* a client's connections, shown under its row */
  tr.conns > td, tr.conns:hover { background:var(--soft); }
  tr.conns > td { padding:.1rem .85rem .35rem 2.6rem; white-space:normal; text-align:left; }
  .ci { display:grid; grid-template-columns:auto 1fr auto auto; gap:.1rem .8rem; align-items:baseline; padding:.45rem 0; }
  .ci + .ci { border-top:1px solid var(--line); }
  .ci .nm { font:.82rem var(--mono); overflow-wrap:break-word; min-width:0; }
  .ci .cm { display:block; font:.68rem var(--mono); color:var(--muted); margin-top:.1rem; }
  .ci .cm > span + span::before { content:' · '; }
  .ci .num { font-size:.8rem; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; }
  @media (max-width:640px) { tr.conns > td { padding-left:1rem; } }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:.55rem .85rem; white-space:nowrap; text-align:right; border-bottom:1px solid var(--line); }
  th.l, td.l { text-align:left; }
  th { font:600 .62rem var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:var(--soft); }
  td.rank, td.dim { color:var(--muted); }
  td .addr { font-weight:500; margin-right:.4rem; }
  td .dot { margin-right:.55rem; }
  td.brk { white-space:normal; overflow-wrap:break-word; }
  .off { color:var(--muted); opacity:.45; }
  .delta { font-size:.75rem; margin-left:.35rem; }
  @media (max-width:640px) { th, td { padding:.5rem .55rem; } .opt { display:none; } }

  .ov { margin-top:1.4rem; } /* the summary sits on the page, not in a card */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1rem 1.2rem; }
  .kpi .k { font:600 .6rem var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .kpi .v { font-size:1.15rem; font-weight:600; line-height:1.2; margin-top:.3rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* phones: four per row, counts first, usage second */
  @media (max-width:640px) {
    .kpis { grid-template-columns:repeat(4,1fr); gap:.85rem .6rem; }
    .kpi .k { font-size:.56rem; letter-spacing:.08em; }
    .kpi .v { font-size:1rem; margin-top:.2rem; }
    .kpi .v small { font-size:.62rem; }
    .kpi .s { font-size:.6rem; }
  }
  .kpi .v small { font-size:.7rem; font-weight:500; color:var(--muted); margin-left:.2em; }
  .kpi { min-width:0; }
  .kpi .s { font:.68rem var(--mono); color:var(--muted); margin-top:.1rem; }
  .kpi .s span { white-space:nowrap; }
  .probes { margin-top:1rem; padding-top:.85rem; border-top:1px solid var(--line); }
  .probes .head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.5rem; }
  .probes .head .k { font:600 .6rem var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .probes .head b { font-size:.95rem; font-variant-numeric:tabular-nums; }
  .stack { display:flex; gap:2px; height:.45rem; border-radius:99px; overflow:hidden; background:var(--soft); }
  .stack span { background:var(--accent); min-width:2px; }
  .legend { display:flex; flex-wrap:wrap; gap:.3rem 1.1rem; margin-top:.6rem; font:.72rem var(--mono); color:var(--muted); }
  .legend i { display:inline-block; width:.55rem; height:.55rem; border-radius:2px; background:var(--accent); margin-right:.4em; }
  .legend b { color:var(--ink); font-weight:500; margin-left:.35em; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
<header>
  <h1>cfipd</h1>
  <div class="status"><span id="badge"></span><span id="updated"></span></div>
  <nav>
    <button id="lang" title="Language / 语言">中文</button>
    <button id="refresh">↻</button>
  </nav>
</header>
<div id="err"></div>
<div id="tip"></div>

<div class="ov" id="overview"></div>

<h2 data-i18n="h_active">Active</h2>
<div class="cards" id="actives"></div>

<h2 data-i18n="h_clients">Clients</h2>
<div id="clients"></div>

<h2><span data-i18n="h_select">Selection</span></h2>
<div class="card sel" id="select"></div>

<h2 data-i18n="h_standby">Standby</h2>
<div id="standbys"></div>

</main>

<script>
const POLL_MS = 10000, STALE_MS = 30000;
let lastOK = 0, inflight = false, failed = false, timer = null, lastData = null, lastErr = '';
let openClients = new Set(); // clients whose connections are shown

// UI strings. English is the source language; zh is a translation, not a second code path.
const I18N = {
  en: {
    title: 'cfipd dashboard', refresh: 'Refresh',
    h_active: 'Active', h_clients: 'Clients',
    c_open: 'open', c_closed: 'closed', c_failed: 'failed',
    h_select: 'Selection', h_standby: 'Standby', faster: 'ms faster than the slowest active',
    st_loading: 'Loading…', st_nocon: 'Cannot reach cfipd', st_lost: 'Connection lost', st_stale: 'Data is stale',
    st_none: 'No active', st_serving: n => `${n} active`, st_degraded: n => ` · ${n} degraded`,
    updated: s => `${s}s ago`, req_failed: 'Request failed: ', showing_last: ' (showing the last good data)',
    k_median: 'probe time', k_jitter: 'jitter', k_speed: 'bandwidth', ago: (n, u) => `${n}${u} ago`, unknown_time: 'time unknown',
    m_conns: 'conns', m_connect: 'connect', m_up: '↑ up', m_down: '↓ down', m_fail: 'fail', m_next: 'next probe',
    open: n => `${n} open`, failed: n => `${n} failed`, of_samples: (p, n) => `${p} of ${n}`,
    s_promo: 'Promotion', s_pk: 'PK', running: 'testing', idle: 'idle',
    pk_comparing: 'comparing', pk_observing: s => `observing until ${s}`, pk_pending: s => `confirming ${s}`, pk_ready: 'ready',
    th_ip: 'IP', th_probe: 'Probe time', th_jitter: 'Jitter', th_fail: 'Fail', th_samples: 'Samples', th_next: 'Next check',
    th_client: 'Client', th_open: 'Open', th_conns: 'Conns', th_failed: 'Failed', th_up: '↑ Up', th_down: '↓ Down', th_last: 'Last seen', online: 'online',
    no_active: 'No active', no_standby: 'No standby', no_clients: 'No clients',
    k_active: 'Active', k_standby: 'Standby', k_cand: 'Candidates', k_relay: 'Relay', k_uptime: 'Uptime',
    k_clients: 'Clients', online_n: n => `${n} online`, k_mem: 'Memory', mem_cap: n => `cap ${n} MB`, k_tests: 'Tests today', k_probes: 'Probes today', conns: 'conns', degraded_n: n => `${n} degraded`,
  },
  zh: {
    title: 'cfipd 仪表盘', refresh: '刷新',
    h_active: 'Active', h_clients: '客户端',
    c_open: '进行中', c_closed: '已结束', c_failed: '失败',
    h_select: '选择', h_standby: 'Standby', faster: '比最慢的 Active 快的毫秒数',
    st_loading: '加载中…', st_nocon: '无法连接 cfipd', st_lost: '连接中断', st_stale: '数据过期',
    st_none: '没有 Active', st_serving: n => `${n} 个 Active`, st_degraded: n => ` · ${n} 个降级`,
    updated: s => `${s} 秒前`, req_failed: '请求失败：', showing_last: '（显示的是上次成功的数据）',
    k_median: '探测耗时', k_jitter: '抖动', k_speed: '带宽', ago: (n, u) => `${n} ${{ m: '分钟', h: '小时', d: '天' }[u]}前`, unknown_time: '时间未知',
    m_conns: '连接', m_connect: '建连', m_up: '↑ 上行', m_down: '↓ 下行', m_fail: '失败率', m_next: '下次探测',
    open: n => `当前 ${n}`, failed: n => `失败 ${n}`, of_samples: (p, n) => `${p}（${n} 次）`,
    s_promo: '转正测试', s_pk: 'PK', running: '进行中', idle: '空闲',
    pk_comparing: '对比中', pk_observing: s => `观察期至 ${s}`, pk_pending: s => `待确认 ${s}`, pk_ready: '就绪',
    th_ip: 'IP', th_probe: '探测耗时', th_jitter: '抖动', th_fail: '失败率', th_samples: '样本', th_next: '下次检查',
    th_client: '客户端', th_open: '当前', th_conns: '连接', th_failed: '失败', th_up: '↑ 上行', th_down: '↓ 下行', th_last: '最近使用', online: '在线',
    no_active: '没有 Active', no_standby: '没有 Standby', no_clients: '没有客户端',
    k_active: 'Active', k_standby: 'Standby', k_cand: '候选', k_relay: 'Relay', k_uptime: '运行时长',
    k_clients: '客户端', online_n: n => `${n} 在线`, k_mem: '内存', mem_cap: n => `上限 ${n} MB`, k_tests: '今日测速', k_probes: '今日探测', conns: '连接', degraded_n: n => `${n} 个降级`,
  },
};
const STATE_ZH = { healthy: '健康', degraded: '降级' };

let lang = 'en';
try { lang = localStorage.getItem('cfipd.lang') || ''; } catch (e) {}
if (!I18N[lang]) lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
const t = k => I18N[lang][k] ?? I18N.en[k] ?? k;
const stateText = s => (lang === 'zh' && STATE_ZH[s]) || s;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => v ? Math.round(v).toLocaleString('en-US') : '—';
const ms = v => v ? Math.round(v) + ' ms' : '—';
// fail_rate is omitted from the JSON when it is zero.
const failPct = v => v.samples > 0 ? ((v.fail_rate || 0) * 100).toFixed(0) + '%' : '—';
const fam = a => a.includes(':') ? 'IPv6' : 'IPv4';
const brk = a => esc(a).replace(/([:.])/g, '$1<wbr>'); // addresses and names break at : and .
// A long IPv6 address shows its /48 (the prefix unit of cfipd) and its last
// group; the tooltip has the whole address.
const v6short = a => { const g = a.split(':'); return `${g.slice(0, 3).join(':')}:…:${g[g.length - 1]}`; };
const ip = a => a && a.includes(':') && a.length > 19 ? `<span data-tip="${esc(a)}">${esc(v6short(a))}</span>` : esc(a);
// The same in daemon text, such as a PK verdict (already escaped: no ':' in entities).
const ipText = s => esc(s).replace(/\b[0-9a-f]{1,4}(?::[0-9a-f]{0,4}){4,7}\b/gi, ip);
// Go durations: "4m0s" -> "4m", "1h16m53s" -> "1h16m".
const dur = s => s ? esc(String(s).replace(/(h\d+m)[\d.]+s$/, '$1').replace(/([hm])0s$/, '$1').replace(/h0m$/, 'h')) : '—';
function secs(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h' + Math.floor(s % 3600 / 60) + 'm';
}
const clock = iso => new Date(iso).toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-GB', { hour12: false });
function bytes(n) {
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!(s >= 0)) return t('unknown_time');
  const [n, u] = s < 3600 ? [Math.max(1, Math.round(s / 60)), 'm'] : s < 172800 ? [Math.round(s / 3600), 'h'] : [Math.round(s / 86400), 'd'];
  return t('ago')(n, u);
}
const vu = (v, u) => `${v}<small>${u}</small>`;
const bytesVU = n => vu(...bytes(n).split(' '));

function setBadge() {
  const el = $('badge'), age = Date.now() - lastOK, act = lastData ? lastData[0].actives : [];
  const degraded = act.filter(a => a.state !== 'healthy').length;
  let cls = '', text = t('st_loading');
  if (lastOK && age > STALE_MS) [cls, text] = ['warn', t('st_stale')];
  else if (failed) [cls, text] = ['bad', lastOK ? t('st_lost') : t('st_nocon')];
  else if (lastOK && !act.length) [cls, text] = ['bad', t('st_none')];
  else if (lastOK) [cls, text] = [degraded ? 'warn' : 'ok', t('st_serving')(act.length) + (degraded ? t('st_degraded')(degraded) : '')];
  el.className = cls;
  el.innerHTML = `<span class="dot"></span>${esc(text)}`;
}

function render(status, standbys, relay, clients, conns) {
  const relayBy = Object.fromEntries(relay.map(r => [r.addr, r]));
  const degraded = status.actives.filter(a => a.state !== 'healthy').length;
  const rt = relay.reduce((s, r) => ({ n: s.n + r.total, up: s.up + r.bytes_up, down: s.down + r.bytes_down }), { n: 0, up: 0, down: 0 });
  const mem = status.memory_mb, online = clients.filter(c => c.open > 0).length;
  const probes = Object.entries(status.probes_today || {}).sort((x, y) => y[1] - x[1]);
  const total = probes.reduce((s, [, v]) => s + v, 0);
  const shade = i => (1 - i * 0.7 / Math.max(1, probes.length - 1)).toFixed(2);
  $('overview').innerHTML = `<div class="kpis">${[
    ['k_active', status.actives.length, degraded ? `<span class="warn">${t('degraded_n')(degraded)}</span>` : ''],
    ['k_standby', status.standbys], ['k_cand', status.candidates],
    ['k_clients', clients.length, online ? `<span class="ok">${t('online_n')(online)}</span>` : ''],
    ['k_relay', vu(rt.n, t('conns')), `<span>↑ ${bytes(rt.up)}</span> <span>↓ ${bytes(rt.down)}</span>`],
    ['k_uptime', dur(status.uptime)],
    ['k_mem', mem ? vu(mem.go_in_use, 'MB') : '—', mem && mem.limit ? t('mem_cap')(mem.limit) : ''], ['k_tests', bytesVU(status.bytes_today)],
  ].map(([k, v, sub]) => `<div class="kpi"><div class="k">${t(k)}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`).join('')}</div>
  <div class="probes">
    <div class="head"><span class="k">${t('k_probes')}</span><b>${total.toLocaleString('en-US')}</b></div>
    <div class="stack">${probes.map(([k, v], i) => `<span style="flex:${v};opacity:${shade(i)}" data-tip="${esc(k)} ${v}"></span>`).join('')}</div>
    <div class="legend">${probes.map(([k, v], i) => `<span><i style="opacity:${shade(i)}"></i>${esc(k)}<b>${v.toLocaleString('en-US')}</b></span>`).join('')}</div>
  </div>`;

  $('actives').innerHTML = status.actives.length ? status.actives.map(a => {
    const r = relayBy[a.addr], bad = a.state !== 'healthy';
    return `<div class="card ip">
      <div class="ch">
        <span class="dot ${bad ? 'warn' : 'ok'}" data-tip="${esc(stateText(a.state))}"></span>
        <span class="addr">${ip(a.addr)}</span>
        <span class="tags">${bad ? `<span class="tag warn">${esc(stateText(a.state))}</span>` : ''}<span class="tag">${esc(a.colo || '?')}</span><span class="tag">${fam(a.addr)}</span></span>
      </div>
      <div class="big">
        <div><div class="v">${n0(a.median_ms)}<small>ms</small></div><div class="k">${t('k_median')}</div></div>
        <div><div class="v">±${n0(a.jitter_ms)}<small>ms</small></div><div class="k">${t('k_jitter')}</div></div>
        <div><div class="v">${a.speed_mbps ? n0(a.speed_mbps) + '<small>Mbps</small>' : '—'}</div>
          <div class="k">${t('k_speed')}${a.speed_mbps ? ' · ' + (a.speed_at ? ago(a.speed_at) : t('unknown_time')) : ''}</div></div>
      </div>
      <div class="meta">${[
        ['m_conns', `${r?.total || 0} · ${t('open')(r?.conns || 0)}${r?.fails ? ` · <span class="bad">${t('failed')(r.fails)}</span>` : ''}`],
        ['m_connect', ms(r?.connect_ema_ms)], ['m_up', bytes(r?.bytes_up)], ['m_down', bytes(r?.bytes_down)],
        ['m_fail', t('of_samples')(failPct(a), a.samples || 0)], ['m_next', dur(a.next_in)],
      ].map(([k, v]) => `<span class="k">${t(k)}</span><span class="v">${v}</span>`).join('')}</div>
    </div>`;
  }).join('') : `<div class="empty">${t('no_active')}</div>`;

  // Connections grouped by client IP; the list keeps open ones first, then the newest.
  const ipOf = a => a.startsWith('[') ? a.slice(1, a.indexOf(']')) : a.slice(0, a.lastIndexOf(':'));
  const byClient = {};
  for (const c of conns) (byClient[ipOf(c.client)] ??= []).push(c);
  const connItem = c => {
    const [st, dot] = !c.end ? [t('c_open'), 'ok'] : c.error ? [t('c_failed'), 'bad'] : [t('c_closed'), 'off'];
    const meta = [`<span>:${esc(c.client.slice(c.client.lastIndexOf(':') + 1))}</span>`, `<span>${clock(c.start)}</span>`,
      c.upstream && `<span class="opt">→ ${ip(c.upstream)}</span>`, c.error && `<span class="bad">${esc(c.error)}</span>`].filter(Boolean).join('');
    return `<div class="ci"><span class="dot ${dot}" data-tip="${st}"></span><div class="nm">${brk(c.sni || '—')}<span class="cm">${meta}</span></div>
      <span class="num">${secs(c.seconds)}</span><span class="num">${bytes(c.bytes_down)}</span></div>`;
  };
  $('clients').innerHTML = clients.length ? `<div class="card tw"><table>
    <thead><tr><th class="l">${t('th_client')}</th><th class="opt">${t('th_open')}</th><th class="opt">${t('th_conns')}</th><th class="opt">${t('th_failed')}</th>
      <th class="opt">${t('th_up')}</th><th>${t('th_down')}</th><th>${t('th_last')}</th></tr></thead>
    <tbody>${clients.map(c => {
      const cs = byClient[c.addr] || [], open = cs.length > 0 && openClients.has(c.addr);
      const tog = cs.length ? ` class="tog" tabindex="0" role="button" aria-expanded="${open}" data-client="${esc(c.addr)}"` : '';
      return `<tr${tog}><td class="l brk"><span class="chev">${cs.length ? (open ? '▾' : '▸') : ''}</span><span class="dot ${c.open > 0 ? 'ok' : 'off'}"></span><span class="mono addr">${ip(c.addr)}</span></td>
      <td class="opt">${c.open}</td><td class="opt">${c.total}</td><td class="opt ${c.fails ? 'bad' : 'dim'}">${c.fails}</td>
      <td class="opt">${bytes(c.bytes_up)}</td><td>${bytes(c.bytes_down)}</td>
      <td class="${c.open > 0 ? 'ok' : 'dim'}">${c.open > 0 ? t('online') : ago(c.last_seen)}</td></tr>`
        + (open ? `<tr class="conns"><td colspan="7">${cs.map(connItem).join('')}</td></tr>` : '');
    }).join('')}</tbody>
    </table></div>` : `<div class="empty">${t('no_clients')}</div>`;

  const pk = status.pk || {};
  const pkState = pk.running ? ['ok', t('pk_comparing')]
    : pk.observe_until ? ['warn', t('pk_observing')(pk.observe_until.slice(5, 16).replace('T', ' '))]
    : pk.pending ? ['warn', t('pk_pending')(pk.pending)] : ['', t('pk_ready')];
  $('select').innerHTML = `
    <span class="k">${t('s_promo')}</span>
    <span class="v"><span class="pill ${status.promoting ? 'ok' : ''}">${status.promoting ? t('running') : t('idle')}</span></span>
    <span class="k">${t('s_pk')}</span>
    <span class="v"><span class="pill ${pkState[0]}">${esc(pkState[1])}</span>
      <span class="last">${pk.last ? ipText(pk.last) : '—'}</span></span>`;

  const slowest = Math.max(0, ...status.actives.map(a => a.median_ms || 0));
  const faster = s => {
    const d = Math.round(slowest - (s.median_ms || Infinity));
    return d > 0 ? `<span class="delta ok" data-tip="${t('faster')}">−${d}</span>` : '';
  };
  $('standbys').innerHTML = standbys.length ? `<div class="card tw"><table>
    <thead><tr><th class="opt">#</th><th class="l">${t('th_ip')}</th><th>${t('th_probe')}</th><th class="opt">${t('th_jitter')}</th>
      <th>${t('th_fail')}</th><th class="opt">${t('th_samples')}</th><th class="opt">${t('th_next')}</th></tr></thead>
    <tbody>${standbys.map((s, i) => `<tr><td class="rank opt">${i + 1}</td>
      <td class="l"><span class="mono addr">${ip(s.addr)}</span><span class="tag">${esc(s.colo || '?')}</span></td>
      <td>${ms(s.median_ms)}${faster(s)}</td><td class="opt">±${ms(s.jitter_ms)}</td><td>${failPct(s)}</td>
      <td class="opt">${s.samples || 0}</td><td class="dim opt">${dur(s.next_in)}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty">${t('no_standby')}</div>`;

}

function showUpdated() {
  const text = lastOK ? t('updated')(Math.round((Date.now() - lastOK) / 1000)) : '';
  $('updated').textContent = text;
  if (text) $('badge').dataset.tip = text; else delete $('badge').dataset.tip;
}
function showErr() {
  const el = $('err');
  if (!lastErr) { el.style.display = 'none'; return; }
  el.textContent = t('req_failed') + lastErr + (lastOK ? t('showing_last') : '');
  el.style.display = 'block';
}
// Re-apply every piece of text that depends on the language.
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('lang').textContent = lang === 'zh' ? 'EN' : '中文';
  $('refresh').title = t('refresh');
  $('refresh').setAttribute('aria-label', t('refresh'));
  setBadge(); showUpdated(); showErr();
  if (lastData) render(...lastData);
}

async function poll() {
  if (inflight) return;
  inflight = true;
  $('refresh').disabled = true;
  try {
    const [status, standbys, relay, clients, conns] = await Promise.all(
      ['api/status', 'api/standbys', 'api/relay', 'api/clients', 'api/conns'].map(async u => {
        const r = await fetch(u);
        if (!r.ok) throw new Error(u + ': HTTP ' + r.status + ' ' + (await r.text()).trim());
        return r.json();
      }));
    lastData = [status, standbys || [], relay || [], clients || [], conns || []];
    render(...lastData);
    lastOK = Date.now();
    failed = false;
    lastErr = '';
  } catch (e) {
    failed = true;
    lastErr = e.message;
  } finally {
    inflight = false;
    $('refresh').disabled = false;
    setBadge(); showUpdated(); showErr();
    clearTimeout(timer);
    timer = setTimeout(poll, POLL_MS);
  }
}

// No pinch zoom on phones: iOS Safari ignores user-scalable=no and touch-action.
for (const e of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(e, ev => ev.preventDefault(), { passive: false });
document.addEventListener('touchmove', ev => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });

// Tips show on hover and on tap, since phones have no hover. The tip is fixed
// on the screen, so a tap elsewhere or a scroll hides it.
const tip = $('tip');
function showTip(ev) {
  const el = ev.target.closest && ev.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip;
  tip.style.display = 'block';
  tip.style.left = Math.max(6, Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 6)) + 'px';
  tip.style.top = Math.max(6, Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 6)) + 'px';
}
document.addEventListener('pointermove', showTip);
document.addEventListener('pointerdown', showTip);
addEventListener('scroll', () => { tip.style.display = 'none'; }, { passive: true });

// A client row shows or hides its connections, by click, Enter, or Space.
function toggleClient(el) {
  const row = el.closest && el.closest('tr.tog');
  if (!row || !lastData) return;
  const a = row.dataset.client;
  openClients.has(a) ? openClients.delete(a) : openClients.add(a);
  render(...lastData);
}
document.addEventListener('click', ev => toggleClient(ev.target));
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr.tog')) { ev.preventDefault(); toggleClient(ev.target); }
});
$('refresh').onclick = () => { clearTimeout(timer); poll(); };
$('lang').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('cfipd.lang', lang); } catch (e) {}
  applyLang();
};
setInterval(() => { setBadge(); showUpdated(); }, 1000);
applyLang();
poll();
</script>
</body>
</html>
